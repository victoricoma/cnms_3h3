<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Loteria</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }
        .card{
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 10px rgb(0, 0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .ball-container{
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .ball{
            background-color: #2e7d32;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .button{
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 6px; 
            cursor: pointer;
            transition: 0.2;
        }
        .button:hover{
            background-color: #1b5e20;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="ball-container">
            {% for num in numeros %}
                <div class="ball">{{ "%02d" % num }}</div>
            {% endfor %}
        </div>
        <form action="POST">
            <button type="submit">🍀Gerar Numeros🍀</button>
        </form>
    </div>
</body>
</html>
